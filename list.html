<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一覧・修正 — ダイス運アーカイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10141c; --paper:#f4efe3; --paper2:#ece4d2;
    --blood:#9a2f2f; --blood2:#c0432f; --gold:#b8923f;
    --line:#cabd9f; --shadow:rgba(16,20,28,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Zen Kaku Gothic New',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;
    background-image:radial-gradient(circle at 12% -10%, rgba(192,67,47,.10), transparent 45%),
      radial-gradient(circle at 110% 20%, rgba(184,146,63,.12), transparent 40%);
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.04;z-index:0;
    background-image:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 3px)}
  .wrap{max-width:960px;margin:0 auto;padding:36px 20px 80px;position:relative;z-index:1}
  .kicker{font-family:'DotGothic16';letter-spacing:.35em;font-size:.72rem;color:var(--blood);text-transform:uppercase}
  h1{font-weight:900;font-size:clamp(1.8rem,5vw,2.9rem);margin:.1em 0 .15em}
  h1 .mark{color:var(--blood2)}
  .lead{color:#5a5446;font-size:.95rem;max-width:52ch}
  nav.navbtns{display:flex;gap:10px;margin:26px 0 28px;flex-wrap:wrap}
  .navbtn{font-size:.9rem;font-weight:800;text-decoration:none;color:var(--ink);
    padding:11px 24px;border:1px solid var(--line);border-radius:11px;
    background:linear-gradient(180deg,#fbf7ec,#ece4d2);
    box-shadow:0 4px 0 -1px var(--line),0 8px 18px -10px var(--shadow);transition:.15s}
  .navbtn:hover{transform:translateY(-1px);border-color:var(--blood2);color:var(--blood)}
  .navbtn:active{transform:translateY(2px);box-shadow:0 1px 0 -1px var(--line)}
  .navbtn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);
    box-shadow:0 4px 0 -1px #000,0 10px 20px -10px var(--shadow)}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .search{flex:1;min-width:200px;background:#fffdf7;border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-family:inherit;font-size:.9rem}
  .search:focus{outline:none;border-color:var(--blood2)}
  .count{font-family:'DotGothic16';font-size:.78rem;color:#8a8270}

  table{width:100%;border-collapse:collapse;background:linear-gradient(180deg,#fbf7ec,#f1e9d8);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 14px 34px -18px var(--shadow)}
  thead th{font-family:'DotGothic16';font-size:.72rem;letter-spacing:.1em;color:#6a6354;text-align:left;
    padding:13px 14px;background:var(--paper2);border-bottom:2px solid var(--line)}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:middle}
  tbody tr:hover{background:rgba(192,67,47,.04)}
  tbody tr.dup{background:rgba(184,146,63,.12)}
  .scn{font-weight:700}
  .pc{color:#3a3528}
  .pl{font-weight:800;color:var(--blood)}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .ibtn{border:1px solid var(--line);background:#fffdf7;border-radius:7px;padding:6px 11px;cursor:pointer;
    font-family:inherit;font-size:.78rem;color:#5a5446}
  .ibtn:hover{border-color:var(--blood2);color:var(--blood)}
  .ibtn.del:hover{background:var(--blood);color:#fff;border-color:var(--blood)}

  .dupnote{background:rgba(184,146,63,.14);border:1px solid var(--gold);border-radius:10px;
    padding:12px 16px;font-size:.84rem;color:#6a5a2f;margin-bottom:16px;display:none}
  .dupnote.show{display:block}

  /* 編集モーダル */
  .modal{position:fixed;inset:0;background:rgba(16,20,28,.5);display:none;place-items:center;z-index:40;padding:20px}
  .modal.show{display:grid}
  .modal .box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px;max-width:440px;width:100%;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
  .modal h3{font-size:1.05rem;font-weight:800;margin-bottom:16px}
  .modal label{display:block;font-size:.78rem;color:#6a6354;margin:0 0 5px;font-weight:700}
  .modal input,.modal select{width:100%;font-family:inherit;font-size:.92rem;background:#fffdf7;
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:14px}
  .modal input:focus,.modal select:focus{outline:none;border-color:var(--blood2)}
  .btn{font-family:inherit;font-weight:800;font-size:.9rem;cursor:pointer;border:none;border-radius:10px;padding:12px 22px}
  .btn.primary{background:var(--blood);color:#fdf3e7}.btn.primary:hover{background:var(--blood2)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--ink);
    color:var(--paper);padding:14px 24px;border-radius:10px;opacity:0;transition:.3s;z-index:50;font-size:.9rem}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--blood)}
  .empty{text-align:center;color:#8a8270;padding:60px 20px;font-family:'DotGothic16';font-size:.85rem}
  @media(max-width:600px){
    thead{display:none}
    tbody td{display:block;padding:6px 14px}
    tbody tr{display:block;padding:10px 0;border-bottom:2px solid var(--line)}
    .row-actions{justify-content:flex-start;padding:8px 14px 4px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">CCFOLIA DICE ARCHIVE</div>
  <h1>格納データ<span class="mark">一覧</span></h1>
  <p class="lead">納められた記録の一覧です。表示されるのはシナリオ名・PC名・PL名のみ。出目の数値は伏せられています。紐付け間違いや重複は、ここで誰でも直せます。</p>
  <nav class="navbtns">
    <a href="index.html" class="navbtn">投稿</a>
    <a href="list.html" class="navbtn active">一覧・修正</a>
  </nav>

  <div class="dupnote" id="dupNote"></div>

  <div class="toolbar">
    <input class="search" id="search" placeholder="シナリオ名・PC名・PL名で絞り込み…">
    <span class="count" id="count"></span>
  </div>

  <table>
    <thead>
      <tr><th>シナリオ名</th><th>PC名</th><th>PL名</th><th></th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">まだ記録がありません</div>
</div>

<!-- 編集モーダル -->
<div class="modal" id="modal">
  <div class="box">
    <h3>記録を修正</h3>
    <label>シナリオ名</label>
    <input type="text" id="eScenario">
    <label>PC名</label>
    <input type="text" id="ePc">
    <label>PL名</label>
    <select id="ePlSelect"></select>
    <input type="text" id="ePlText" placeholder="PL名（候補に無い場合）" style="display:none">
    <div class="acts">
      <button class="btn ghost" id="eCancel">やめる</button>
      <button class="btn primary" id="eSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { db, firebaseReady, collection, getDocs, doc, getDoc, updateDoc, deleteDoc, query, orderBy } from "./common.js";

const $=id=>document.getElementById(id);
let rows=[];
let plOptions=[];
let editing=null;

async function loadPl(){
  if(!firebaseReady||!db){plOptions=[];return;}
  try{
    const s=await getDocs(collection(db,"players"));
    plOptions=s.docs.map(d=>d.data().name).filter(Boolean).sort();
  }catch(e){plOptions=[]}
}

async function load(){
  if(!firebaseReady||!db){
    $("empty").style.display="block";
    $("empty").textContent="Firebase未設定です（手順書STEP4）。設定すると記録が表示されます。";
    return;
  }
  await loadPl();
  const snap=await getDocs(collection(db,"entries"));
  rows=snap.docs.map(d=>({id:d.id,...d.data()}));
  rows.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  render();
}

function findDuplicates(list){
  const seen={}, dup=new Set();
  list.forEach(r=>{
    const key=`${(r.scenario||"").trim()}|${(r.pcName||"").trim()}|${(r.plName||"").trim()}`;
    if(seen[key]!==undefined){dup.add(r.id);dup.add(seen[key]);}
    else seen[key]=r.id;
  });
  return dup;
}

function render(){
  const kw=$("search").value.trim().toLowerCase();
  const filtered=rows.filter(r=>{
    if(!kw)return true;
    return (r.scenario||"").toLowerCase().includes(kw)||
           (r.pcName||"").toLowerCase().includes(kw)||
           (r.plName||"").toLowerCase().includes(kw);
  });
  const dup=findDuplicates(rows);

  $("count").textContent=`${filtered.length} / ${rows.length} 件`;
  $("empty").style.display=rows.length===0?"block":"none";

  if(dup.size>0){
    $("dupNote").classList.add("show");
    $("dupNote").textContent=`⚠ 同じ「シナリオ×PC×PL」の重複が ${dup.size} 件あります（黄色の行）。不要な行は削除してください。`;
  }else{
    $("dupNote").classList.remove("show");
  }

  const tb=$("tbody");
  tb.innerHTML=filtered.map(r=>`
    <tr class="${dup.has(r.id)?'dup':''}">
      <td class="scn">${esc(r.scenario)}</td>
      <td class="pc">${esc(r.pcName)}</td>
      <td class="pl">${esc(r.plName)}</td>
      <td>
        <div class="row-actions">
          <button class="ibtn" data-edit="${r.id}">修正</button>
          <button class="ibtn del" data-del="${r.id}">削除</button>
        </div>
      </td>
    </tr>`).join("");

  tb.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));
  tb.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>del(b.dataset.del));
}

$("search").oninput=render;

// ---- 編集 ----
function openEdit(id){
  editing=rows.find(r=>r.id===id);
  if(!editing)return;
  $("eScenario").value=editing.scenario||"";
  $("ePc").value=editing.pcName||"";
  const sel=$("ePlSelect"), txt=$("ePlText");
  if(plOptions.length>0){
    sel.style.display="block"; txt.style.display="none";
    sel.innerHTML=plOptions.map(p=>`<option value="${escAttr(p)}">${esc(p)}</option>`).join("")
      +`<option value="__OTHER__">— その他（自由入力）—</option>`;
    if(plOptions.includes(editing.plName)) sel.value=editing.plName;
    else{sel.value="__OTHER__";txt.style.display="block";txt.value=editing.plName||"";}
    sel.onchange=()=>{txt.style.display=sel.value==="__OTHER__"?"block":"none";};
  }else{
    sel.style.display="none"; txt.style.display="block"; txt.value=editing.plName||"";
  }
  $("modal").classList.add("show");
}
$("eCancel").onclick=()=>$("modal").classList.remove("show");

$("eSave").onclick=async()=>{
  if(!editing)return;
  const scenario=$("eScenario").value.trim();
  const pcName=$("ePc").value.trim();
  let plName;
  const sel=$("ePlSelect");
  if(plOptions.length>0 && sel.value!=="__OTHER__") plName=sel.value;
  else plName=$("ePlText").value.trim();
  if(!scenario||!pcName||!plName){toast("空欄があります","err");return;}

  try{
    // entries 更新
    await updateDoc(doc(db,"entries",editing.id),{scenario,pcName,plName});
    // stats 側も対応する entryId のものを更新（メタの一貫性のため）
    const sSnap=await getDocs(collection(db,"stats"));
    const target=sSnap.docs.find(d=>d.data().entryId===editing.id);
    if(target) await updateDoc(doc(db,"stats",target.id),{scenario,pcName,plName});
    toast("修正しました");
    $("modal").classList.remove("show");
    await load();
  }catch(err){toast("更新失敗："+err.message,"err");}
};

// ---- 削除 ----
async function del(id){
  if(!confirm("この記録を削除します。よろしいですか？"))return;
  try{
    await deleteDoc(doc(db,"entries",id));
    const sSnap=await getDocs(collection(db,"stats"));
    const target=sSnap.docs.find(d=>d.data().entryId===id);
    if(target) await deleteDoc(doc(db,"stats",target.id));
    toast("削除しました");
    await load();
  }catch(err){toast("削除失敗："+err.message,"err");}
}

function toast(m,t){const e=$("toast");e.textContent=m;e.className="toast show"+(t==="err"?" err":"");
  setTimeout(()=>e.className="toast"+(t==="err"?" err":""),2400);}
function esc(s){const d=document.createElement("div");d.textContent=s??"";return d.innerHTML;}
function escAttr(s){return String(s??"").replace(/"/g,"&quot;");}

load();
</script>
</body>
</html>
